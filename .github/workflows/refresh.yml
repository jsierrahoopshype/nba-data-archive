name: Weekly refresh

# Runs every Sunday at 04:00 UTC.
# Also runnable manually from the Actions tab.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      force_current_season:
        description: "Force-refresh current-season files even if sizes match"
        type: boolean
        default: true
      current_season_floor:
        description: "Earliest season year to treat as current"
        type: string
        default: "2025"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine refresh flags
        id: flags
        run: |
          force="true"
          floor="2025"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            force="${{ inputs.force_current_season }}"
            floor="${{ inputs.current_season_floor }}"
          fi
          echo "force=$force"   >> "$GITHUB_OUTPUT"
          echo "floor=$floor"   >> "$GITHUB_OUTPUT"

      - name: Pre-populate data/ from existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          for tag in shotdetail matchups nbastats nbastatsv3 pbpstats datanba cdnnba; do
            echo "Pulling existing $tag assets..."
            gh release download "$tag" \
              --repo jsierrahoopshype/nba-data-archive \
              --dir data \
              --skip-existing \
              --pattern "*.tar.xz" || true
          done
          echo "Local data/ now has $(ls data/*.tar.xz 2>/dev/null | wc -l) files."

      - name: Download from upstream
        run: |
          if [ "${{ steps.flags.outputs.force }}" = "true" ]; then
            python scripts/01_download_archives.py \
              --force-current-season \
              --current-season-floor ${{ steps.flags.outputs.floor }}
          else
            python scripts/01_download_archives.py
          fi

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.flags.outputs.force }}" = "true" ]; then
            python scripts/02_upload_to_releases.py \
              --clobber-current-season \
              --current-season-floor ${{ steps.flags.outputs.floor }}
          else
            python scripts/02_upload_to_releases.py
          fi

      - name: Convert to Parquet
        run: |
          rm -rf parquet
          python scripts/03_convert_to_parquet.py

      - name: Upload to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/04_upload_to_huggingface.py

      - name: Upload manifest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ github.run_id }}
          path: data/_manifest.json
          if-no-files-found: warn
          retention-days: 90
